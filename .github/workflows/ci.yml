name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ais-dev-b54cjczgdn7dcvfkp7jurj
  GAR_LOCATION: us-central1
  SERVICE_NAME: stream-vault
  REGION: us-east1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  authenticate:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/804326557407/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: stream-vault-sa@ais-dev-b54cjczgdn7dcvfkp7jurj.iam.gserviceaccount.com

  docker-push:
    runs-on: ubuntu-latest
    needs: authenticate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/804326557407/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: stream-vault-sa@ais-dev-b54cjczgdn7dcvfkp7jurj.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci && npm run build
      - run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/stream-vault/stream-vault:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker-push
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/804326557407/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: stream-vault-sa@ais-dev-b54cjczgdn7dcvfkp7jurj.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/stream-vault/stream-vault:latest
          flags: "--port=3000 --memory=512Mi --cpu=1 --allow-unauthenticated"
