steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stream-vault:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stream-vault:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: 'build-image'

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/stream-vault:$COMMIT_SHA'
    id: 'push-image'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=.'
      - '--image=gcr.io/$PROJECT_ID/stream-vault:$COMMIT_SHA'
      - '--location=us-central1'
      - '--namespace=default'
    id: 'deploy-cloudrun'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=us-central1'
      - 'CLOUDSDK_CONTAINER_CLUSTER=stream-vault-cluster'

# Image built and pushed
images:
  - 'gcr.io/$PROJECT_ID/stream-vault:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/stream-vault:latest'

# Timeout for the entire build
timeout: '1800s'

# Substitutions for environment variables
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'stream-vault'
