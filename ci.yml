name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: ais-dev-b54cjczgdn7dcvfkp7jurj
  GAR_LOCATION: us-central1
  SERVICE_NAME: stream-vault
  REGION: us-east1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --ext .ts,.tsx 2>/dev/null || true

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: |
          if [ -f "index.html" ]; then
            echo "✓ Build artifacts verified"
            ls -lah
          else
            echo "✗ Build failed - index.html not found"
            exit 1
          fi

  authenticate:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
    outputs:
      access-token: ${{ steps.auth.outputs.access_token }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/804326557407/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: stream-vault-sa@ais-dev-b54cjczgdn7dcvfkp7jurj.iam.gserviceaccount.com

  docker:
    runs-on: ubuntu-latest
    needs: authenticate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci && npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: stream-vault:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    runs-on: ubuntu-latest
    needs: [authenticate, docker]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/804326557407/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: stream-vault-sa@ais-dev-b54cjczgdn7dcvfkp7jurj.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/stream-vault/stream-vault:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: push
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/804326557407/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: stream-vault-sa@ais-dev-b54cjczgdn7dcvfkp7jurj.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/stream-vault/stream-vault:latest
          flags: '--port=3000 --memory=512Mi --cpu=1 --allow-unauthenticated'

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} --format='value(status.url)')
          echo "Testing $SERVICE_URL/healthz"
          curl -f "$SERVICE_URL/healthz" || exit 1
          echo "✓ Health check passed"
